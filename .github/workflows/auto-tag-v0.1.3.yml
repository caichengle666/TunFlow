name: Auto tag v0.1.3

on:
  workflow_run:
    workflows: ["Desktop Build"]
    types: [completed]
    branches: [fix/windows-network-hardening]

permissions:
  contents: write

jobs:
  tag:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Tag successful Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if gh api repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.1.3 >/dev/null 2>&1; then
            echo "v0.1.3 already exists; nothing to do"
            exit 0
          fi
          gh api --method POST repos/${GITHUB_REPOSITORY}/git/refs \
            -f ref='refs/tags/v0.1.3' \
            -f sha="$HEAD_SHA"
