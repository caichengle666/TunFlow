name: Desktop Build

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'engine/**'
      - 'routing/**'
      - 'tunnel/**'
      - 'core/**'
      - 'proxy/**'
      - 'metadata/**'
      - 'dialer/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'engine/**'
      - 'routing/**'
      - 'tunnel/**'
      - 'core/**'
      - 'proxy/**'
      - 'metadata/**'
      - 'dialer/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: desktop/go.mod

      - name: Prepare dependencies
        working-directory: desktop
        run: go mod tidy

      - name: Build desktop
        working-directory: desktop
        env:
          CGO_ENABLED: '1'
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build

      - name: Download and verify Wintun
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          Invoke-WebRequest 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          $expected = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Wintun SHA256 mismatch: $actual" }
          $extract = Join-Path $env:RUNNER_TEMP 'wintun'
          Expand-Archive $zip -DestinationPath $extract -Force
          Copy-Item (Join-Path $extract 'wintun/bin/amd64/wintun.dll') 'desktop/build/bin/wintun.dll' -Force

      - name: Download GeoIP and GeoSite data
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://raw.githubusercontent.com/caichengle666/x-tunnel/main/geoip.dat' -OutFile 'desktop/build/bin/geoip.dat'
          Invoke-WebRequest 'https://raw.githubusercontent.com/caichengle666/x-tunnel/main/geosite.dat' -OutFile 'desktop/build/bin/geosite.dat'

      - name: Add version metadata
        shell: powershell
        run: |
          $version = "0.1.$env:GITHUB_RUN_NUMBER"
          $exe = 'desktop/build/bin/TunFlow.exe'
          "TunFlow $version" | Out-File -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'version.txt')
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          "Version: $version" | Out-File -Encoding utf8 'desktop/build/bin/VERSION.txt'

      - name: Smoke check packaged files
        shell: powershell
        run: |
          $required = @('desktop/build/bin/TunFlow.exe','desktop/build/bin/wintun.dll','desktop/build/bin/geoip.dat','desktop/build/bin/geosite.dat','desktop/build/bin/VERSION.txt')
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing artifact: $file" }
          }
          Get-ChildItem desktop/build/bin | Format-Table Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TunFlow-windows-amd64
          path: desktop/build/bin/
