name: Desktop Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'desktop/**'
      - 'engine/**'
      - 'routing/**'
      - 'tunnel/**'
      - 'core/**'
      - 'proxy/**'
      - 'metadata/**'
      - 'dialer/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'engine/**'
      - 'routing/**'
      - 'tunnel/**'
      - 'core/**'
      - 'proxy/**'
      - 'metadata/**'
      - 'dialer/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: desktop/go.mod

      - name: Prepare dependencies
        working-directory: desktop
        run: go mod tidy

      - name: Build desktop
        working-directory: desktop
        env:
          CGO_ENABLED: '1'
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build

      - name: Download and verify Wintun
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          Invoke-WebRequest 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          $expected = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Wintun SHA256 mismatch: $actual" }
          $extract = Join-Path $env:RUNNER_TEMP 'wintun'
          Expand-Archive $zip -DestinationPath $extract -Force
          Copy-Item (Join-Path $extract 'wintun/bin/amd64/wintun.dll') 'desktop/build/bin/wintun.dll' -Force

      - name: Download GeoIP and GeoSite data
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://raw.githubusercontent.com/caichengle666/x-tunnel/main/geoip.dat' -OutFile 'desktop/build/bin/geoip.dat'
          Invoke-WebRequest 'https://raw.githubusercontent.com/caichengle666/x-tunnel/main/geosite.dat' -OutFile 'desktop/build/bin/geosite.dat'

      - name: Create portable config
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $config = @'
{
  "proxy": "",
  "device": "tun://TunFlow",
  "interface": "",
  "mode": "global",
  "directCIDRs": [],
  "directRules": [],
  "proxyRules": [],
  "defaultRoute": "proxy",
  "geoIPFile": "geoip.dat",
  "autoRoute": true,
  "startWithWindows": false
}
'@
          Set-Content -Path 'desktop/build/bin/config.json' -Value $config -Encoding utf8

      - name: Read release version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $wails = Get-Content 'desktop/wails.json' -Raw | ConvertFrom-Json
          $version = $wails.info.productVersion
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Missing productVersion in desktop/wails.json' }
          "TUNFLOW_VERSION=$version" >> $env:GITHUB_ENV

      - name: Add version metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'desktop/build/bin/TunFlow.exe'
          if (-not (Test-Path $exe)) { throw 'TunFlow.exe not found' }
          "TunFlow $env:TUNFLOW_VERSION" | Out-File -Encoding utf8 'desktop/build/bin/VERSION.txt'
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Smoke check packaged files
        shell: powershell
        run: |
          $required = @('desktop/build/bin/TunFlow.exe','desktop/build/bin/wintun.dll','desktop/build/bin/geoip.dat','desktop/build/bin/geosite.dat','desktop/build/bin/VERSION.txt','desktop/build/bin/config.json')
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing artifact: $file" }
          }
          Get-ChildItem desktop/build/bin | Format-Table Name,Length

      - name: Create Windows release archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "TunFlow-v$env:TUNFLOW_VERSION-Windows-amd64.zip"
          Compress-Archive -Path 'desktop/build/bin/*' -DestinationPath $archive -Force
          "RELEASE_ARCHIVE=$archive" >> $env:GITHUB_ENV
          Get-Item $archive | Format-List Name,Length,LastWriteTime

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TunFlow-windows-amd64-v${{ env.TUNFLOW_VERSION }}
          path: |
            desktop/build/bin/
            TunFlow-v${{ env.TUNFLOW_VERSION }}-Windows-amd64.zip

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:TUNFLOW_VERSION"
          $out = Join-Path $env:RUNNER_TEMP 'gh-release-out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'gh-release-err.txt'
          $view = Start-Process -FilePath 'gh' -ArgumentList @('release','view',$tag,'--json','tagName') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          if ($view.ExitCode -eq 0) {
            & gh release upload $tag $env:RELEASE_ARCHIVE --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
            & gh release edit $tag --draft=false --latest --title "TunFlow $tag"
            if ($LASTEXITCODE -ne 0) { throw "gh release publish failed with exit code $LASTEXITCODE" }
          } else {
            & gh release create $tag $env:RELEASE_ARCHIVE --target $env:GITHUB_SHA --title "TunFlow $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          }
          Write-Host "Published $env:RELEASE_ARCHIVE to $tag"
