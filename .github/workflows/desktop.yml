name: Desktop Build

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'engine/**'
      - 'routing/**'
      - 'tunnel/**'
      - 'core/**'
      - 'proxy/**'
      - 'metadata/**'
      - 'dialer/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'engine/**'
      - 'routing/**'
      - 'tunnel/**'
      - 'core/**'
      - 'proxy/**'
      - 'metadata/**'
      - 'dialer/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: desktop/go.mod

      - name: Prepare dependencies
        working-directory: desktop
        run: go mod tidy

      - name: Build desktop
        working-directory: desktop
        env:
          CGO_ENABLED: '1'
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build

      - name: Download Wintun
        working-directory: desktop
        shell: pwsh
        run: |
          $version = '0.14.1'
          $archive = Join-Path $env:RUNNER_TEMP "wintun-$version.zip"
          $extract = Join-Path $env:RUNNER_TEMP "wintun-$version"
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$version.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          Copy-Item "$extract/wintun/bin/amd64/wintun.dll" "build/bin/wintun.dll" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TunFlow-windows-amd64
          path: desktop/build/bin/*
